[project]
name = "probability-gap"
version = "0.1.0"
description = "The Probability Gap: Quant Interview Foundations from Zero — content build (PDF course, notebooks, verification suite)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "sympy>=1.13",
    "matplotlib>=3.9",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"